<style>
/* VOICE: calm, plain-spoken, professional — a tool a 45-year-old warehouse lead trusts on first glance
   IDEA: the Proserve "command centre" look: frosted panels over a dark, softly lit backdrop
   PICTURE: the question card itself, with large rounded answer rows and app-style icon tiles
   COLOUR and TYPE: charcoal night, frosted glass, forklift amber for identity, coral-to-crimson for actions; Roboto
   LAYOUT: single centred column, page header with icon tile, floating pill bar for actions */
:root{color-scheme:dark;--bg:#0d1014;--ink:#f4f5f7;--mute:#9aa1ab;--dim:#6b727c;
--glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.045));--line:rgba(255,255,255,.1);--hi:rgba(255,255,255,.14);
--soft:rgba(255,255,255,.07);--soft2:rgba(255,255,255,.12);
--act:linear-gradient(90deg,#ff7759,#e53b4e 55%,#a81c49);
--good:#3ddc84;--goodbg:rgba(61,220,132,.13);--bad:#ff6b6b;--badbg:rgba(255,107,107,.13);--sel:#5aa9ff;--selbg:rgba(90,169,255,.14)}
*{box-sizing:border-box;min-width:0}
html{background:var(--bg);touch-action:manipulation}
body{margin:0;min-height:100vh;color:var(--ink);font:17px/1.5 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:3px}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#1b222b 0%,#0d1014 60%)}
.scene i{position:absolute;border-radius:50%;filter:blur(90px)}
.scene i:nth-child(1){width:70vmax;height:28vmax;left:-15vmax;top:30%;background:#c99a1e;opacity:.22;transform:rotate(-14deg)}
.scene i:nth-child(2){width:40vmax;height:40vmax;right:-14vmax;top:-12vmax;background:#3c4a5c;opacity:.5}
.scene i:nth-child(3){width:34vmax;height:20vmax;right:-6vmax;bottom:6%;background:#8a2a3a;opacity:.18}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(26px) saturate(140%);backdrop-filter:blur(26px) saturate(140%);box-shadow:inset 0 1px 0 var(--hi),0 20px 40px rgba(0,0,0,.25);border-radius:28px}
.wrap{max-width:720px;margin:0 auto;padding:max(26px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 140px max(18px,env(safe-area-inset-left))}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.tile{flex:none;display:grid;place-items:center;border-radius:12px;width:40px;height:40px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 12px rgba(0,0,0,.25)}
.tile svg{width:22px;height:22px}
.tile.lg{width:64px;height:64px;border-radius:18px}.tile.lg svg{width:40px;height:40px}
.t-amber{background:linear-gradient(160deg,#ffc04d,#f07a1a)}.t-red{background:linear-gradient(160deg,#ff6b6b,#d02f4b)}
.t-blue{background:linear-gradient(160deg,#5cb2ff,#2a6cf0)}.t-green{background:linear-gradient(160deg,#4fe08f,#17a356)}
.t-purple{background:linear-gradient(160deg,#9b8cff,#5b45f0)}.t-pink{background:linear-gradient(160deg,#ff8ad8,#c43ad6)}
.t-grey{background:linear-gradient(160deg,#8b93a0,#545b66)}
.ph{display:flex;align-items:center;gap:16px;margin:4px 2px 24px}
.ph h1{font-size:clamp(30px,7vw,38px);font-weight:700;letter-spacing:-.01em}
.ph p{margin:3px 0 0;color:var(--mute);font-size:16px}
.sec{padding:22px 20px;margin-bottom:16px}
.sh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sh h2{font-size:21px;font-weight:700;flex:1}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:14px 16px;border-radius:20px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.fact span{display:block;color:var(--mute);font-size:14px}
.fact b{font-size:20px;font-weight:700}
.note{color:var(--mute);font-size:15px;margin:14px 2px 0}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode>span:last-child{display:block}
.mode{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:16px;border-radius:22px;background:rgba(0,0,0,.18);border:1px solid var(--line);min-height:44px}
.mode b{display:block;font-size:17px;color:var(--ink)}
.mode span{color:var(--mute);font-size:14px;line-height:1.35}
.mode .tile{width:36px;height:36px;border-radius:11px}.mode .tile svg{width:20px;height:20px}

.list{display:grid}

/* quiz */
.qh{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.back{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.qh .tx{flex:1}
.qh b{display:block;font-size:20px}
.qh span{color:var(--mute);font-size:15px}
.timer{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;padding:10px 16px;border-radius:99px;white-space:nowrap}
.timer.low{color:var(--bad);border-color:rgba(255,107,107,.5)}
.prog{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:0 2px 18px}
.prog i{display:block;height:100%;border-radius:9px;background:var(--act);transition:width .25s}
.qcard{padding:22px 18px 18px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tag{font-size:14px;font-weight:500;padding:5px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.tag.must{color:#ffd7a0;background:rgba(240,122,26,.16);border-color:rgba(255,192,77,.35)}
.qtext{font-size:clamp(20px,5vw,24px);font-weight:500;line-height:1.35;margin:0 2px 20px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:20px;background:rgba(0,0,0,.2);border:1px solid var(--line);min-height:58px;transition:background .15s,border-color .15s}
.opt .k{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--soft2)}
.opt.sel{border-color:var(--sel);background:var(--selbg)}.opt.sel .k{background:var(--sel);color:#0b1a2e}
.opt.right{border-color:var(--good);background:var(--goodbg)}.opt.right .k{background:var(--good);color:#06240f}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .k{background:var(--bad);color:#2b0606}
.opt.miss{border-color:var(--good);border-style:dashed}.opt.miss .k{color:var(--good)}
.verdict{display:flex;gap:10px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:18px;font-weight:500}
.verdict svg{flex:none}
.verdict.ok{background:var(--goodbg);color:var(--good)}.verdict.no{background:var(--badbg);color:var(--bad)}
.jump{margin-top:16px;padding:18px}
.jump summary{cursor:pointer;color:var(--mute);font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
.jump summary::-webkit-details-marker{display:none}
.jump[open] summary svg{transform:rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:14px}
.n{height:44px;border-radius:14px;font-weight:500;font-size:15px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.n.ans{color:var(--ink);background:var(--soft2)}
.n.ok{color:var(--good);background:var(--goodbg);border-color:rgba(61,220,132,.45)}
.n.no{color:var(--bad);background:var(--badbg);border-color:rgba(255,107,107,.45)}
.n.cur{border-color:#fff;color:#fff}
.n.must{box-shadow:inset 0 -3px 0 #f0a33a}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:13.5px;color:var(--dim)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;background:#f0a33a;vertical-align:middle;margin-right:6px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));width:min(720px,calc(100% - 28px));padding:10px;border-radius:99px;z-index:5;display:flex;gap:10px}
.bar .pillbtn{min-height:54px;font-size:17px}
.bar .act{flex:1}
/* results */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:132px;height:132px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v b{font-size:34px;line-height:1}
.ring .v span{color:var(--mute);font-size:14px}
.sres{flex:1;min-width:200px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:700;margin-bottom:6px}
.status.ok{color:var(--good)}.status.no{color:var(--bad)}
.sres p{margin:0;color:var(--mute);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0 16px}
.acts{display:flex;flex-wrap:wrap;gap:10px}.acts .pillbtn{flex:1 1 180px}
.seg{display:flex;gap:8px;margin:0 0 14px}
.seg button{min-height:44px;padding:0 18px;border-radius:99px;font-size:15px;font-weight:500;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--soft2);color:var(--ink);border-color:rgba(255,255,255,.3)}
.ri{padding:18px;border-radius:22px;background:rgba(0,0,0,.18);border:1px solid var(--line);margin-bottom:10px}
.ri h3{font-size:17px;font-weight:500;line-height:1.4;margin:10px 0 12px}
.ri ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.ri li{display:flex;gap:10px;font-size:15.5px;padding:9px 12px;border-radius:12px}
.ri li b{flex:none;width:18px}
.ri li.right{background:var(--goodbg);color:var(--good)}.ri li.wrong{background:var(--badbg);color:var(--bad)}
.ri li.miss{box-shadow:inset 0 0 0 1px rgba(61,220,132,.5);color:var(--good)}
.ri .who{opacity:.8;font-size:13.5px}
.empty{color:var(--mute);text-align:center;padding:14px}
/* modal */
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(5,7,10,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal[hidden]{display:none}
.modal .box{max-width:420px;width:100%;padding:24px;background:linear-gradient(180deg,rgba(40,46,54,.92),rgba(26,30,36,.94))}
.modal h2{font-size:22px;margin-bottom:8px}
.modal p{color:var(--mute);margin:0 0 20px}
.modal .r{display:flex;gap:10px}.modal .r>*{flex:1}
.snd{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none;color:var(--mute)}
.ph .snd{margin-left:auto}
.qcard{position:relative}
.tag.streak{color:#ffd7a0;background:rgba(240,122,26,.16);border-color:rgba(255,192,77,.35);display:inline-flex;align-items:center;gap:4px}
.tag.streak svg{width:14px;height:14px}
.shake{animation:shake .36s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.float{position:fixed;z-index:26;font-size:26px;font-weight:700;color:var(--good);pointer-events:none;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:rise 1.1s ease-out forwards}
.float.no{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-44px)}}
.sticky{position:sticky;top:0;z-index:6;margin:-8px -10px 14px;padding:max(8px,env(safe-area-inset-top)) 10px 10px;border-radius:0 0 24px 24px;background:linear-gradient(180deg,rgba(13,16,20,.94),rgba(13,16,20,.8));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sticky .qh{margin-bottom:12px}.sticky .prog,.sticky .tbar{margin-bottom:0}.sticky .rhud{margin:12px 4px 0}
.joke{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 88px);width:min(520px,calc(100% - 32px));padding:14px 18px;border-radius:22px;z-index:24;display:flex;gap:14px;align-items:center;font-weight:500;font-size:16.5px;line-height:1.35;pointer-events:none;background:linear-gradient(180deg,rgba(66,52,30,.96),rgba(38,31,22,.96));border:1px solid rgba(255,192,77,.45);box-shadow:0 18px 40px rgba(0,0,0,.4);animation:jk 4s ease forwards}

.joke .e{font-size:30px;line-height:1;flex:none}
@keyframes jk{0%{opacity:0;transform:translate(-50%,18px) scale(.96)}7%,86%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
.wing{position:fixed;bottom:-70px;left:var(--x);font-size:var(--s);line-height:1;z-index:27;pointer-events:none;animation:wingup var(--d) cubic-bezier(.3,.1,.6,1) var(--dl) forwards}
@keyframes wingup{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(var(--w),-30vh) rotate(-12deg)}50%{transform:translate(calc(var(--w) * -1),-62vh) rotate(10deg)}100%{transform:translate(var(--w),-125vh) rotate(-8deg)}}
.tbar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin:0 2px 14px}
.tbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#ffc04d,#f07a1a)}
.tbar.low i{background:var(--act)}
.rhud{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 4px 14px}
.lbl{display:block;color:var(--mute);font-size:14px}
.rhud b{font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums;transition:color .2s}
.rhud b.beat{color:var(--good)}
.mult{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:99px;font-weight:700;font-size:18px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.mult svg{width:16px;height:16px}
.mult.m2{color:#1d1206;background:linear-gradient(160deg,#ffc04d,#f07a1a);border-color:transparent}
.mult.m3{color:#fff;background:linear-gradient(160deg,#ff7759,#d02f4b);border-color:transparent}
.mult.m4{color:#fff;background:linear-gradient(160deg,#9b8cff,#5b45f0);border-color:transparent;box-shadow:0 0 22px rgba(155,140,255,.45)}
.mult.pop{animation:popm .45s}

.toast{position:fixed;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:12px 22px;border-radius:99px;z-index:25;font-weight:500;white-space:nowrap;animation:toast 2.2s ease forwards;background:linear-gradient(180deg,rgba(48,54,63,.95),rgba(30,34,40,.95))}

.wide{width:100%}
.race .sh h2{flex:1}
.chal{border-color:rgba(255,192,77,.45)}
.rres{text-align:center}
.bigs{font-size:clamp(56px,16vw,76px);font-weight:700;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.rres .status{margin-top:12px}
.vs{font-size:18px;font-weight:500;margin:10px 0 0}.vs.ok{color:var(--good)}.vs.no{color:var(--bad)}
.field{display:block;margin:0 0 12px}
.field span{display:block;color:var(--mute);font-size:14px;margin:0 0 6px 4px}

      <div class="sres">${full?`<div class="status ${pass?'ok':'no'}">${pass?I.ok+'Pass':I.no+'Not passed'}</div>`:''}<p>${why}</p></div>
    </div>
    <div class="stats"><div class="fact"><span>Correct</span><b>${score}</b></div><div class="fact"><span>Incorrect</span><b>${n-score}</b></div><div class="fact"><span>Q6 to Q10</span><b>${critOk}/${crit.length}</b></div></div>
    <div class="acts">${wrong.length?`<button class="pillbtn act" id="rw">Retry ${wrong.length} incorrect</button>`:''}<button class="pillbtn" id="ag">Start paper again</button><button class="pillbtn" id="hm">All papers</button></div>
  </section>
  <section class="sec glass">
    <div class="sh"><span class="tile t-purple">${I.chart}</span><h2>Your answers</h2></div>
    <div class="seg" role="group"><button data-f="all" aria-pressed="${rf==='all'}">All</button><button data-f="wrong" aria-pressed="${rf==='wrong'}">Incorrect (${wrong.length})</button></div>
    ${res.filter(r=>rf==='all'||!r.ok).map(({j,ok})=>{const q=P[j],s=S.sel[j]||[];return `<div class="ri"><div class="tags" style="margin:0"><span class="tag">Question ${j+1}</span>${q.c?'<span class="tag must">Must pass</span>':''}<span class="tag" style="color:var(--${ok?'good':'bad'})">${ok?'Correct':s.length?'Incorrect':'Not answered'}</span></div><h3>${esc(q.q)}</h3><ul>${q.o.map((t,i)=>{const on=s.includes(i),a=q.a.includes(i),c=a&&on?'right':on?'wrong':a?'miss':'';return c?`<li class="${c}"><b>${L[i]}</b><span>${esc(t)}${on?' <span class="who">(your answer)</span>':''}</span></li>`:''}).join('')}</ul></div>`}).join('')||'<p class="empty">No incorrect answers.</p>'}
  </section>
  ${credit()}`;
  const p=S.paper,idx=S.idx,re=S.retry;
  const rw=document.getElementById('rw');if(rw)rw.onclick=()=>{S.saved=false;start(p,wrong)};
  document.getElementById('ag').onclick=()=>{S.saved=false;start(p,re?idx:null)};
  document.getElementById('hm').onclick=()=>{S.saved=false;home()};document.getElementById('hb').onclick=()=>{S.saved=false;home()};
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{rf=b.dataset.f;const y=scrollY;finish();scrollTo(0,y)});
  window.scrollTo(0,0);
}

function raceStart(ch){
  clearInterval(tick);S.idx=null;S.done=false;
  const seed=ch?ch.seed:(Math.random()*2147483646|0)+1;
  R={seed,ch,order:shuffle(ALLQ.map((_,i)=>i),rng(seed)),pos:0,score:0,streak:0,bestStreak:0,right:0,answered:0,left:RACE_T*1000,last:performance.now(),paused:false,lock:false,sel:[],live:true,beat:false,lastSec:RACE_T};
  history.replaceState(null,'',location.pathname+'#race');
  raceQ();window.scrollTo(0,0);SND.tap();
  tick=setInterval(raceTick,100);
}
function raceTick(){
  if(!R||!R.live)return;const now=performance.now();if(!R.paused)R.left-=now-R.last;R.last=now;
  const l=Math.max(0,R.left),sec=Math.ceil(l/1000),tt=document.getElementById('tt'),tb=document.getElementById('tb');
  if(tt){tt.textContent=fmt(sec);tt.classList.toggle('low',sec<=10)}
  if(tb){tb.style.width=(l/(RACE_T*10))+'%';tb.parentNode.classList.toggle('low',sec<=10)}
  if(sec<R.lastSec){R.lastSec=sec;if(sec<=10&&sec>0&&!R.paused)SND.tick()}
  if(l<=0&&!R.paused)raceEnd();
}
const rcur=()=>ALLQ[R.order[R.pos%R.order.length]];
function raceQ(){
  const {q,p,i}=rcur(),m=mult(R.streak),sec=Math.ceil(Math.max(0,R.left)/1000);
  R.sel=[];R.lock=false;R.qt=performance.now();
  app.innerHTML=`
  <div class="sticky"><header class="qh"><button class="back glass" id="ex" aria-label="Leave race">${I.left}</button>
    <div class="tx"><b>Race</b><span>${R.right} correct${R.ch?` · Target ${fmtN(R.ch.score)}`:''}</span></div>
    ${sndBtn()}<span class="timer glass ${sec<=10?'low':''}" id="tt" aria-label="Time left">${fmt(sec)}</span></header>
  <div class="tbar ${sec<=10?'low':''}"><i id="tb" style="width:${Math.max(0,R.left)/(RACE_T*10)}%"></i></div>
  <div class="rhud"><div><span class="lbl">Points</span><b id="rs" class="${R.beat?'beat':''}">${fmtN(R.score)}</b></div><span class="mult m${m}" id="rm">${m>1?I.bolt:''}x${m}</span></div></div>
  <article class="qcard glass" id="rc">
    <div class="tags"><span class="tag">Paper ${p+1} · Q${i+1}</span>${q.c?'<span class="tag must">Must pass</span>':''}${q.k>1?`<span class="tag" id="need">Select ${q.k} answers</span>`:''}${R.streak>=2?`<span class="tag streak">${I.bolt}${R.streak} in a row</span>`:''}</div>
    <h2 class="qtext">${esc(q.q)}</h2>
    <div class="opts">${q.o.map((t,j)=>`<button class="opt" data-r="${j}"><span class="k">${L[j]}</span><span>${esc(t)}</span></button>`).join('')}</div>
  </article>`;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>racePick(+b.dataset.r));
  window.scrollTo(0,0);
  document.getElementById('ex').onclick=()=>{R.paused=true;ask('Leave the race?','This run will not be saved.','Leave',home,()=>{R.paused=false;R.last=performance.now()})};
}
let lastTap=null;
function racePick(j){
  if(!R||!R.live||R.lock||R.paused)return;const {q}=rcur();
  if(q.k===1)R.sel=[j];else R.sel=R.sel.includes(j)?R.sel.filter(x=>x!==j):[...R.sel,j];
  lastTap=app.querySelector(`[data-r="${j}"]`);
  app.querySelectorAll('[data-r]').forEach((b,x)=>b.classList.toggle('sel',R.sel.includes(x)));
  const nd=document.getElementById('need');if(nd)nd.textContent=R.sel.length<q.k?`Select ${q.k-R.sel.length} more`:'Checking';
  if(R.sel.length===q.k)raceSubmit();else SND.tap();
}
function raceSubmit(){
  const {q}=rcur(),ok=isRight(q,R.sel),card=document.getElementById('rc');
  R.lock=true;R.paused=true;R.answered++;
  app.querySelectorAll('[data-r]').forEach((b,x)=>{b.classList.remove('sel');b.disabled=true;const on=R.sel.includes(x),a=q.a.includes(x);if(a&&on)b.classList.add('right');else if(on)b.classList.add('wrong');else if(a&&q.k===q.a.length)b.classList.add('miss')});
  const before=mult(R.streak);
  if(ok){
    R.streak++;R.right++;R.bestStreak=Math.max(R.bestStreak,R.streak);
    const m=mult(R.streak),t=performance.now()-R.qt,bonus=Math.round(Math.max(0,Math.min(50,50*(1-(t-2500)/7500)))),pts=((q.k>1?150:100)+bonus)*m;
    R.score+=pts;floatPts(lastTap,'+'+fmtN(pts));SND.ok(R.streak-1);buzz(12);
    if(m>before){setTimeout(()=>SND.level(),170);toast(`${R.streak} in a row. Points x${m}`)}
  }else{R.streak=0;R.left-=3000;floatPts(lastTap,'−3 seconds',true);SND.no();buzz([30,50,30]);card.classList.add('shake');
    const a=app.querySelector('.opt.right,.opt.miss');if(a){const r=a.getBoundingClientRect();if(r.top<170||r.bottom>innerHeight-20)a.scrollIntoView({block:'center',behavior:'smooth'})}
    const tt=document.getElementById('tt');if(tt){tt.textContent=fmt(Math.ceil(Math.max(0,R.left)/1000))}}
  fun(q,ok,true);
  const rs=document.getElementById('rs'),rm=document.getElementById('rm'),m2=mult(R.streak);
  rs.textContent=fmtN(R.score);rm.className='mult m'+m2+(m2!==before?' pop':'');rm.innerHTML=(m2>1?I.bolt:'')+'x'+m2;
  if(R.ch&&!R.beat&&R.score>R.ch.score){R.beat=true;rs.classList.add('beat');setTimeout(()=>SND.level(),420);setTimeout(()=>toast(`You've passed ${R.ch.name}'s score`),300)}
  setTimeout(()=>{if(!R||!R.live)return;R.pos++;R.paused=false;R.last=performance.now();if(R.left<=0)raceEnd();else raceQ()},ok?650:1400);
}
function raceEnd(){
  clearInterval(tick);if(!R||!R.live)return;R.live=false;const r=R;
  const best=store.get('race',{score:0,streak:0}),pb=r.score>best.score;
  store.set('race',{score:Math.max(r.score,best.score),streak:Math.max(r.bestStreak,best.streak)});
  const won=r.ch&&r.score>r.ch.score;
  if((pb&&r.score>0)||won){SND.win();confetti()}else SND.end();
  const acc=r.answered?Math.round(r.right/r.answered*100):0;
  history.replaceState(null,'',location.pathname);
  app.innerHTML=`
  <header class="qh"><button class="back glass" id="hb" aria-label="Home">${I.left}</button><div class="tx"><b>Race results</b><span>${r.ch?`Challenge from ${esc(r.ch.name)}`:`${RACE_T} second race`}</span></div>${sndBtn()}</header>
  <section class="sec glass rres">
    <span class="lbl">Time's up. You scored</span>
    <div class="bigs">${fmtN(r.score)}</div><span class="lbl">points</span>
    ${pb&&r.score>0?`<div class="status ok">${I.ok}New personal best</div>`:`<p class="note" style="text-align:center">Your best: ${fmtN(Math.max(best.score,r.score))}</p>`}
    ${r.ch?`<p class="vs ${won?'ok':'no'}">${won?`You beat ${esc(r.ch.name)} by ${fmtN(r.score-r.ch.score)} points`:r.score===r.ch.score?`A draw with ${esc(r.ch.name)}`:`${esc(r.ch.name)} wins by ${fmtN(r.ch.score-r.score)} points`}</p>`:''}
    <div class="stats"><div class="fact"><span>Correct</span><b>${r.right}/${r.answered}</b></div><div class="fact"><span>Accuracy</span><b>${acc}%</b></div><div class="fact"><span>Best streak</span><b>${r.bestStreak}</b></div></div>
    <div class="acts"><button class="pillbtn act" id="again">Race again</button>${r.ch?'<button class="pillbtn" id="rematch">Rematch</button>':''}<button class="pillbtn" id="hm">Home</button></div>
  </section>
  <section class="sec glass">
    <div class="sh"><span class="tile t-blue">${I.share}</span><h2>Challenge a mate</h2></div>
    <p class="note" style="margin:0 2px 14px">Send a link. They get the same questions in the same order, with your score to beat.</p>
    <label class="field"><span>Your name</span><input id="nm" maxlength="20" autocomplete="given-name" placeholder="First name"></label>
    <button class="pillbtn act wide" id="share">Send challenge</button>
    <p class="note" id="sm" aria-live="polite"></p>
  </section>
  ${credit()}`;
  const nm=document.getElementById('nm');nm.value=store.get('name','');
  document.getElementById('again').onclick=()=>raceStart(null);
  const rm=document.getElementById('rematch');if(rm)rm.onclick=()=>raceStart(r.ch);
  document.getElementById('hm').onclick=home;document.getElementById('hb').onclick=home;
  document.getElementById('share').onclick=async()=>{
    const sm=document.getElementById('sm'),name=nm.value.trim().slice(0,20);
    if(!name){sm.textContent='Add your name first so they know who to beat.';nm.focus();return}
    store.set('name',name);
    const url=`${location.origin}${location.pathname}?race=${r.seed}.${r.score}.${encodeURIComponent(name)}`;
    const text=`${name} scored ${fmtN(r.score)} on the forklift theory race. Can you beat it?`;
    if(navigator.share){try{await navigator.share({title:'Forklift theory race',text,url});sm.textContent='Challenge sent.';return}catch(e){if(e&&e.name==='AbortError')return}}
    try{await navigator.clipboard.writeText(text+' '+url);sm.textContent='Link copied. Paste it into your group chat.'}catch(e){sm.textContent=url}
  };
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('modal').hidden){if(e.key==='Escape')document.getElementById('mno').click();return}
  if(R&&R.live){if(e.metaKey||e.ctrlKey||e.altKey)return;const q=ALLQ[R.order[R.pos%R.order.length]].q,k=e.key.toUpperCase(),i=L.indexOf(k);if(k.length===1&&i>=0&&i<q.o.length)racePick(i);else if(/^[1-9]$/.test(e.key)&&+e.key<=q.o.length)racePick(+e.key-1);return}
  if(!S.idx||S.done||e.metaKey||e.ctrlKey||e.altKey)return;
  const q=DATA[S.paper][S.idx[S.pos]],k=e.key.toUpperCase(),i=L.indexOf(k);
  if(k.length===1&&i>=0&&i<q.o.length){pick(i);return}
  if(/^[1-9]$/.test(e.key)&&+e.key<=q.o.length){pick(+e.key-1);return}
  if(e.key==='Enter'){e.preventDefault();const c=document.getElementById('chk')||document.getElementById('nx');if(c&&!c.disabled)c.click()}
  if(e.key==='ArrowRight'&&S.pos<S.idx.length-1){S.pos++;quiz()}
  if(e.key==='ArrowLeft'&&S.pos){S.pos--;quiz()}
});
if(CH)home();else if(S.paper!=null)start(S.paper);else home();
}
</script>
<script data-goatcounter="https://probler.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
